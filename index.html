<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>숫자 맞히기</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Gowun+Dodum&display=swap');

    :root {
      color-scheme: light;
      --paper: #f4f0e8;
      --ink: #20231f;
      --muted: #73766c;
      --green: #355a45;
      --green-soft: #dce5d8;
      --orange: #d46b45;
      --line: #d9d4c8;
      --mono: 'DM Mono', monospace;
      --body: 'Gowun Dodum', sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#6f725f22 0.65px, transparent 0.65px);
      background-size: 7px 7px;
      font-family: var(--body);
    }

    button, input { font: inherit; }

    .game {
      width: min(100%, 520px);
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fbfaf6;
      box-shadow: 8px 8px 0 #d9d4c8;
      animation: arrive 420ms ease-out both;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 17px 22px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: 0;
    }

    .live { display: inline-flex; align-items: center; gap: 8px; }
    .live::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6b996e;
      content: '';
    }

    .content { padding: 30px clamp(22px, 7vw, 42px) 34px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--orange);
      font: 12px var(--mono);
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .intro { margin: 9px 0 26px; color: var(--muted); font-size: 15px; }

    .number-line {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 15px;
      margin: 0 0 25px;
      color: var(--muted);
      font: 12px var(--mono);
    }

    .number-line::before, .number-line::after { height: 1px; background: var(--line); content: ''; }
    .number-line span { grid-row: 1; }

    .entry { display: grid; grid-template-columns: 1fr auto; gap: 10px; }

    input {
      width: 100%;
      min-width: 0;
      height: 58px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: #fffefa;
      color: var(--ink);
      font: 20px var(--mono);
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px #355a4518; }
    input:disabled { color: var(--muted); background: #f1efe9; }

    button {
      min-height: 52px;
      padding: 0 20px;
      border: 1px solid var(--green);
      border-radius: 0;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover { background: #284735; }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid #d46b4580; outline-offset: 3px; }
    button:disabled { cursor: not-allowed; opacity: 0.58; }

    .submit { min-width: 94px; height: 58px; font-size: 15px; }

    .feedback {
      min-height: 48px;
      margin: 13px 0 20px;
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--green);
      font-size: 14px;
    }

    .feedback.error { color: #ae4c35; }
    .feedback-mark { font: 16px var(--mono); }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .stat { padding: 15px 0; }
    .stat + .stat { padding-left: 20px; border-left: 1px solid var(--line); }
    .stat-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 12px; }
    .stat-value { font: 18px var(--mono); }

    .history { min-height: 50px; padding-top: 14px; }
    .history-label { color: var(--muted); font-size: 12px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .guess-chip {
      min-width: 34px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      color: var(--ink);
      background: #f3f0e9;
      font: 12px var(--mono);
      text-align: center;
      animation: arrive 180ms ease-out both;
    }

    .guess-chip.high { border-color: #e6b49d; color: #a74d31; background: #fbede5; }
    .guess-chip.low { border-color: #bdcdbb; color: #355a45; background: #edf2e9; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
    }

    .hint { color: var(--muted); font-size: 12px; }
    .restart {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-color: var(--line);
      color: var(--ink);
      background: transparent;
      font-size: 13px;
    }

    .restart:hover { background: #f0eee7; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 420px) {
      body { padding: 16px; }
      .content { padding-top: 25px; padding-bottom: 26px; }
      h1 { font-size: 30px; }
      .footer { align-items: flex-start; }
      .hint { max-width: 165px; line-height: 1.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game" aria-labelledby="title">
    <div class="topline">
      <span class="live">NUMBER GAME</span>
      <span>NO. 001</span>
    </div>
    <section class="content">
      <p class="eyebrow">작은 추리 게임</p>
      <h1 id="title">숫자를 맞혀보세요</h1>
      <p class="intro">숨겨진 숫자는 하나. 힌트를 따라 찾아보세요.</p>

      <div class="number-line"><span>1 &mdash; 100</span></div>
      <form class="entry" id="guess-form">
        <input id="guess-input" type="number" min="1" max="100" inputmode="numeric" placeholder="숫자 입력" aria-label="1부터 100 사이 숫자" autocomplete="off" required>
        <button class="submit" id="submit-button" type="submit">확인</button>
      </form>
      <p class="feedback" id="feedback" role="status" aria-live="polite">
        <span class="feedback-mark" aria-hidden="true">↳</span>
        <span>숫자를 입력하고 확인을 눌러주세요.</span>
      </p>

      <div class="stats" aria-label="게임 기록">
        <div class="stat">
          <span class="stat-label">시도 횟수</span>
          <span class="stat-value" id="attempt-count">00</span>
        </div>
        <div class="stat">
          <span class="stat-label">남은 범위</span>
          <span class="stat-value" id="range-value">1&ndash;100</span>
        </div>
      </div>

      <div class="history">
        <span class="history-label">입력한 숫자</span>
        <div class="history-list" id="history-list" aria-label="지난 추측"></div>
      </div>

      <div class="footer">
        <span class="hint">숫자는 1부터 100 사이의 정수예요.</span>
        <button class="restart" id="restart-button" type="button" title="새 게임 시작">
          <span aria-hidden="true">↻</span> 다시 시작
        </button>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector('#guess-form');
    const input = document.querySelector('#guess-input');
    const submitButton = document.querySelector('#submit-button');
    const restartButton = document.querySelector('#restart-button');
    const feedback = document.querySelector('#feedback');
    const attemptCount = document.querySelector('#attempt-count');
    const rangeValue = document.querySelector('#range-value');
    const historyList = document.querySelector('#history-list');

    let answer;
    let attempts;
    let low;
    let high;
    let finished;

    function startGame() {
      answer = Math.floor(Math.random() * 100) + 1;
      attempts = 0;
      low = 1;
      high = 100;
      finished = false;
      input.disabled = false;
      submitButton.disabled = false;
      input.value = '';
      input.min = 1;
      input.max = 100;
      attemptCount.textContent = '00';
      rangeValue.textContent = '1–100';
      historyList.replaceChildren();
      setFeedback('숫자를 입력하고 확인을 눌러주세요.', '↳');
      input.focus();
    }

    function setFeedback(message, mark, isError = false) {
      feedback.classList.toggle('error', isError);
      feedback.querySelector('.feedback-mark').textContent = mark;
      feedback.lastElementChild.textContent = message;
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const guess = Number(input.value);

      if (!Number.isInteger(guess) || guess < 1 || guess > 100) {
        setFeedback('1부터 100 사이의 정수를 입력해주세요.', '!', true);
        input.focus();
        return;
      }

      if (guess < low || guess > high) {
        setFeedback(`${low}부터 ${high} 사이에서 골라주세요.`, '!', true);
        input.focus();
        return;
      }

      attempts += 1;
      attemptCount.textContent = String(attempts).padStart(2, '0');

      const chip = document.createElement('span');
      chip.className = 'guess-chip';
      chip.textContent = guess;
      historyList.append(chip);

      if (guess === answer) {
        chip.classList.add('low');
        setFeedback(`${attempts}번 만에 찾았어요! 정답은 ${answer}입니다.`, '✓');
        finished = true;
        input.disabled = true;
        submitButton.disabled = true;
        return;
      }

      if (guess < answer) {
        low = guess + 1;
        chip.classList.add('low');
        setFeedback('정답은 더 큰 숫자예요. 조금 더 올려볼까요?', '↑');
      } else {
        high = guess - 1;
        chip.classList.add('high');
        setFeedback('정답은 더 작은 숫자예요. 조금 낮춰볼까요?', '↓');
      }

      rangeValue.textContent = `${low}–${high}`;
      input.value = '';
      input.min = low;
      input.max = high;
      input.focus();
    });

    restartButton.addEventListener('click', startGame);

    startGame();
  </script>
</body>
</html>
